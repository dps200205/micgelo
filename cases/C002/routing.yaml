# 第一步输出：渐进式检索结果（由大模型按 prompts/step1_route_prompt.md 生成）
image_type: 项目知识库/01_局内场景/01_PVP场景/01_常规爆破地图

# 选中参与评审的知识块与条目
blocks:
  - id: dlm
    path: 场景美术基础知识库/平面构成/场景概念设计中的点线面
    reason: 完整场景画面，有明确焦点区（走廊尽头）、大量方向线（墙面红色腰线、地面警示线、天花边线）和大块面（立柱、地面、天花）
    clauses: [D01, D02, D03, D04, D05, D06, D07, D08, D09, D10, D11, D12, D13, D15, D16]
    skipped:
      D14: 用户未要求点线面多类平衡

# 读过卡片但判断不需要评的
skipped_blocks:
  - path: 场景美术基础知识库/平面构成/场景概念设计中的方圆尖
    reason: 功能性走廊，形状性格不是这张图的评审重点（平面构成卡片的选择建议）
  - path: 场景美术基础知识库/立体构成
    reason: 本次不是透视或结构专项评审

# 适用、但知识库尚未建设（报告中提示补充）
missing_knowledge:
  - path: 项目知识库/01_局内场景/01_PVP场景/01_常规爆破地图/场景中的物件摆放规范
    reason: 爆破地图的项目规范，本图适用
  - path: 项目知识库/01_局内场景/01_PVP场景/01_常规爆破地图/场景中的色彩使用规范
    reason: 图中大量使用红黄警示色，需要按项目色彩规范核对
  - path: 场景美术基础知识库/构图与引导
    reason: 走廊纵深透视与地面箭头承担主要引导
  - path: 场景美术基础知识库/场景灯光
    reason: 顶灯与尽头光源决定空间氛围和焦点
  - path: 场景美术基础知识库/黑白灰画面层级
    reason: 立柱暗面与尽头亮区的明度关系影响焦点
  - path: 场景美术基础知识库/色彩关系
    reason: 红色地面、黄色警示线与灰色墙面的色彩搭配
  - path: 场景美术基础知识库/平面构成/场景概念设计中的大中小
    reason: 立柱、机柜、控制台的尺度层级

# 用户在本次输入中提出的额外要求（没有则留空）；格式同 questions.yaml 的 observations / clauses
extra: null
